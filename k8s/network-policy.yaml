apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-isolation
  namespace: runtimes
spec:
  podSelector:
    matchLabels:
      app: 1claw-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}
